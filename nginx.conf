server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compressao basica dos assets.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Cache agressivo para assets versionados pelo Vite (hash no nome).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: qualquer rota desconhecida cai no index.html (React Router).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
